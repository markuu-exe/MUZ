# T-05: checks on every PR and on pushes to main.
# Needs no secrets: tests, typecheck, build and the seed check all run without
# Supabase env (the env guard only matters at runtime in the browser).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on a PR branch; let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -p tsconfig.json
      - run: npx tsc -p api/tsconfig.json
      - run: node scripts/check-api-load.mjs
      - run: npx vite build
      - run: npm run seed:lessons:check
      - run: node scripts/check-bundle-size.mjs
